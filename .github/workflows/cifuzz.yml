name: CIFuzz
on:
  pull_request:
    branches: '**'
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - 'testdata/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'maint/maint*'
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - 'testdata/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions: {}
jobs:
  Fuzzing:
    runs-on: ubuntu-24.04  # Updated in BRS
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@bbb0c0b4826bf8717079ef6774cb12d062e0a3e9 # 2026-06-29
      with:
        oss-fuzz-project-name: 'icu'
        sanitizer: ${{ matrix.sanitizer }}
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@bbb0c0b4826bf8717079ef6774cb12d062e0a3e9 # 2026-06-29
      with:
        oss-fuzz-project-name: 'icu'
        fuzz-seconds: 600
        output-sarif: true
        sanitizer: ${{ matrix.sanitizer }}
    - name: Upload Crash
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure() && steps.build.outcome == 'success'
      with:
        name: ${{ matrix.sanitizer }}-artifacts
        path: ./out/artifacts   
    - name: Upload Sarif
      if: always() && steps.build.outcome == 'success'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        # Path to SARIF file relative to the root of the repository
        sarif_file: cifuzz-sarif/results.sarif
        checkout_path: cifuzz-sarif
