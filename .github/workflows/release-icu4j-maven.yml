# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Release - ICU4J publish to Maven Central

# For this to run you should define the follwing GitHub Secrets in the proper Environment.
# In Settings -- Environments -- release_env -- Environment secrets:
# * MAVEN_CENTRAL_USERNAME & MAVEN_CENTRAL_TOKEN:
#   * Go to https://oss.sonatype.org and login with the `icu-robot` user
#   * Top-right select "Profile"
#   * Open the drop-down list showing "Summary" and select "User Token"
#   * Click the "Access User Token" button
#   * The `username` (first, shorter part of the token) goes in the `MAVEN_CENTRAL_USERNAME` secret
#   * The `password` (second, longer part of the token) goes in the `MAVEN_CENTRAL_TOKEN` secret
# * MAVEN_GPG_PRIVATE_KEY: an ASCII dump of the GPG private signing key:
#     `gpg --output icu_release_signing.asc --armor --export-secret-key <key_id>`
# * MAVEN_GPG_PASSPHRASE: the GPG password used to protect that key

on:
  # To trigger the Env Test workflow manually, follow the instructions in
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:
    inputs: &all_inputs
      runTests:
        description: 'Run the tests.'
        type: boolean
        default: true
      deployToMaven:
        description: 'Deploy to Maven Central (using Sonatype OSSRH)'
        type: boolean
        default: false
      gitReleaseTag:
        description: 'Release tag to upload to. Must start with "release-"'
        type: string
  workflow_call:
    inputs: *all_inputs

env:
  SHARED_MVN_ARGS: '--show-version --batch-mode'
  RELEASE_FOLDER: '${{ github.workspace }}/releaseDist'

permissions:
  contents: read

jobs:
  # This job builds and tests Maven Central artifacts (compiled, source, javadoc, signatures, checksums)
  # Then the artifacts are:
  #   - Published to Maven Cental (if `deployToMaven` set)
  #   - Attached as Github Action artifacts
  #   - Uploaded to the GitHub release (at `gitReleaseTag`)
  publish:
    runs-on: ubuntu-24.04  # Updated in BRS
    environment: release-env

    permissions:
      contents: write # So that we can upload to release
      id-token: write # For artifact attestation
      attestations: write # For artifact attestation

    steps:

    - name: Checkout repo files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: MAVEN_USERNAME # env variable for username in deploy
        server-password: MAVEN_CENTRAL_TOKEN # env variable for token in deploy
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Run tests
      if: ${{ inputs.runTests }}
      run: mvn install --file icu4j ${SHARED_MVN_ARGS} --errors --fail-at-end

    - name: Build javadoc taglets
      run: |
        # Really important to do this first because we need `tools/build` for the javadoc applets
        mvn install --file icu4j/tools/taglets \
          ${SHARED_MVN_ARGS} \
          -DskipTests -DskipITs

    - name: Build and deploy to Maven Central
      run: |
        if [ "${{ inputs.deployToMaven }}" != "true" ]; then
          echo Deploy to local folder
          # Run the deploy, but do it to a local folder, not to Sonatype / Maven Central
          export MAVEN_LOCAL='-DaltDeploymentRepository=tempid::file:./local-deploy-folder'
        else
          echo Deploy to Maven Central using Sonatype OSSRH
        fi
        mvn deploy --file icu4j \
          ${SHARED_MVN_ARGS} ${MAVEN_LOCAL} \
          --settings $GITHUB_WORKSPACE/settings.xml \
          --errors --fail-at-end -DdeployAtEnd=true \
          -DskipTests -DskipITs \
          -P with_sources,with_javadoc,with_signature,to_sonatype
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    # These are files that will end in the "Release" section of the GitHub repo.
    # So the jar files published in GitHub are binary identical to the ones in Maven Central.
    - name: Prepare release folder
      run: |
        pushd icu4j
        # Get the ICU release version in github_rel_version
        source releases_tools/shared.sh
        # Copy the artifacts (with sources and javdoc .jar files) to the release folder
        mvn dependency:copy \
          ${SHARED_MVN_ARGS} \
          -DskipTests -DskipITs \
          -Drelease.directory=${RELEASE_FOLDER} \
          -Dmdep.stripVersion=true \
          -P release_files

        # Rename the artifacts if needed
        mv ${RELEASE_FOLDER}/icu4j.jar                 ${RELEASE_FOLDER}/icu4j-${github_rel_version}.jar
        mv ${RELEASE_FOLDER}/icu4j-javadoc.jar         ${RELEASE_FOLDER}/icu4j-${github_rel_version}-javadoc.jar
        mv ${RELEASE_FOLDER}/icu4j-sources.jar         ${RELEASE_FOLDER}/icu4j-${github_rel_version}-sources.jar
        mv ${RELEASE_FOLDER}/icu4j-charset.jar         ${RELEASE_FOLDER}/icu4j-charset-${github_rel_version}.jar
        mv ${RELEASE_FOLDER}/icu4j-charset-javadoc.jar ${RELEASE_FOLDER}/icu4j-charset-${github_rel_version}-javadoc.jar
        mv ${RELEASE_FOLDER}/icu4j-charset-sources.jar ${RELEASE_FOLDER}/icu4j-charset-${github_rel_version}-sources.jar

        popd # out of icu4j

    - name: Upload build results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: icu4j-binaries
        path: ${{ env.RELEASE_FOLDER }}
        retention-days: 3 # TBD if we want to keep them longer
        overwrite: true

    - name: Upload to release
      if: ${{ inputs.gitReleaseTag && startsWith(inputs.gitReleaseTag, 'release-') }}
      run: |
        gh release upload ${INPUTS_GITRELEASETAG} ${RELEASE_FOLDER}/* --clobber --repo=${{ github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}
        INPUTS_GITRELEASETAG: ${{ inputs.gitReleaseTag }}

    - name: Generate artifact attestation
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ env.RELEASE_FOLDER }}

  # Builds everything we need to for the unified javadoc (icu4j + icu4j-charset) for web publishing.
  # No testing, the only thing we use from this is the javadoc for the site.
  # The results are:
  #   - Attached as Github Action artifacts
  #   - Uploaded to the GitHub release
  # This job was split from `publish` so that we can use the jdk 26 version of javadoc,
  # which has some really nice improvements.
  javadoc_for_website_publishing:
    runs-on: ubuntu-24.04  # Updated in BRS
    environment: release-env

    permissions:
      contents: write # So that we can upload to release
      id-token: write # For artifact attestation
      attestations: write # For artifact attestation

    steps:

    - name: Checkout repo files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Build and install everything so that `site` can find the artifacts for reporting
      run: |
        mvn install --file icu4j \
          ${SHARED_MVN_ARGS} \
          -DskipTests -DskipITs

    # These files will end in the "Release" section of the GitHub repo and on apidoc site
    - name: Prepare site with full javadoc
      run: |
        # Get the ICU release version in github_rel_version
        source icu4j/releases_tools/shared.sh
        # Build the full javadoc to be posted on the public site
        mvn site --file icu4j \
          ${SHARED_MVN_ARGS} \
          -DskipITs -DskipTests \
          -P with_full_javadoc
        # Archive the full doc in a jar. Should also be posted to the web as official doc.
        jar -Mcf ${RELEASE_FOLDER}/icu4j-${github_rel_version}-fulljavadoc.jar \
          -C icu4j/target/site/apidocs/ .

    - name: Upload build results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: icu4j-fulljavadoc
        path: ${{ env.RELEASE_FOLDER }}
        retention-days: 3 # TBD if we want to keep them longer
        overwrite: true

    - name: Upload to release
      if: ${{ inputs.gitReleaseTag && startsWith(inputs.gitReleaseTag, 'release-') }}
      run: |
        gh release upload ${INPUTS_GITRELEASETAG} ${RELEASE_FOLDER}/* --clobber --repo=${{ github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}
        INPUTS_GITRELEASETAG: ${{ inputs.gitReleaseTag }}

    - name: Generate artifact attestation
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ env.RELEASE_FOLDER }}
